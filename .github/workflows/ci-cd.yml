name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}   # -> ghcr.io/<owner>/<repo>-<component>

jobs:
  # --- PR + push gates ---------------------------------------------------------
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # verify runs spotless:check and the Testcontainers tests (Docker is on the runner)
      - run: mvn -B verify
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # build = tsc --noEmit (strict) + vite build; test = vitest over the pure data modules
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  # --- Build the images and push to GHCR (main only) ---------------------------
  build-and-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - component: frontend
            context: .
            dockerfile: docker/frontend.Dockerfile
          - component: api
            context: .
            dockerfile: docker/api.Dockerfile
          - component: worker
            context: .
            dockerfile: docker/worker.Dockerfile
          - component: keycloak
            context: keycloak
            dockerfile: keycloak/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}-${{ matrix.component }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # --- Roll out on the cluster --------------------------------------------------
  # Manifests live in the k8s-cluster-hetzner repo. Each namespace has its own
  # least-privilege ci-deployer ServiceAccount; the two kubeconfigs are the repo
  # secrets KUBE_CONFIG_OURS and KUBE_CONFIG_KEYCLOAK.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check deploy secrets
        id: check
        env:
          KUBE_CONFIG_OURS: ${{ secrets.KUBE_CONFIG_OURS }}
          KUBE_CONFIG_KEYCLOAK: ${{ secrets.KUBE_CONFIG_KEYCLOAK }}
        run: |
          if [ -n "$KUBE_CONFIG_OURS" ]; then echo "ours=true" >> "$GITHUB_OUTPUT"; else echo "ours=false" >> "$GITHUB_OUTPUT"; echo "KUBE_CONFIG_OURS not set — skipping ours deploy."; fi
          if [ -n "$KUBE_CONFIG_KEYCLOAK" ]; then echo "keycloak=true" >> "$GITHUB_OUTPUT"; else echo "keycloak=false" >> "$GITHUB_OUTPUT"; echo "KUBE_CONFIG_KEYCLOAK not set — skipping keycloak deploy."; fi

      # Keycloak is only rolled when something under keycloak/ changed, so an
      # app commit never restarts the identity provider.
      - name: Did keycloak/ change?
        id: kc
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -q '^keycloak/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.33.13          # matches the cluster

      - name: Roll out ours
        if: steps.check.outputs.ours == 'true'
        env:
          KUBECONFIG_B64: ${{ secrets.KUBE_CONFIG_OURS }}
        run: |
          mkdir -p ~/.kube && echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config && chmod 600 ~/.kube/config
          TAG="${GITHUB_SHA::7}"
          kubectl -n ours set image deploy/frontend "frontend=${IMAGE_BASE}-frontend:${TAG}"
          kubectl -n ours set image deploy/api "api=${IMAGE_BASE}-api:${TAG}"
          kubectl -n ours set image deploy/worker "worker=${IMAGE_BASE}-worker:${TAG}"
          kubectl -n ours rollout status deploy/frontend --timeout=180s
          kubectl -n ours rollout status deploy/api --timeout=300s
          kubectl -n ours rollout status deploy/worker --timeout=300s

      - name: Roll out keycloak
        if: steps.check.outputs.keycloak == 'true' && steps.kc.outputs.changed == 'true'
        env:
          KUBECONFIG_B64: ${{ secrets.KUBE_CONFIG_KEYCLOAK }}
        run: |
          mkdir -p ~/.kube && echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config && chmod 600 ~/.kube/config
          TAG="${GITHUB_SHA::7}"
          kubectl -n keycloak set image deploy/keycloak "keycloak=${IMAGE_BASE}-keycloak:${TAG}"
          kubectl -n keycloak rollout status deploy/keycloak --timeout=300s

      - name: Show pod state if the rollout failed
        if: failure()
        run: |
          kubectl -n ours get pods || true
          kubectl -n ours logs -l app=api --tail=100 || true
