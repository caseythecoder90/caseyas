spring:
  application:
    name: ours-api
  threads:
    virtual:
      enabled: true
  mongodb:
    uri: ${SPRING_MONGODB_URI}
  data:
    mongodb:
      # Flamingock owns every index and collection. See common/.../changes.
      auto-index-creation: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ours-web
            client-secret: ${OURS_WEB_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope: openid,profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            # Discovery against the public issuer. From inside the cluster this hairpins through
            # the Ingress, which is the documented fallback in docs/architecture.md section 5.
            issuer-uri: ${KEYCLOAK_ISSUER_URI}

server:
  # ingress-nginx sets X-Forwarded-*; Spring needs them to build the redirect URI and cookies.
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 12h
      cookie:
        name: OURS_SESSION
        http-only: true
        secure: true
        same-site: strict

# Object storage: R2 in production, MinIO locally, both S3 (decision 5).
ours:
  storage:
    endpoint: ${OURS_STORAGE_ENDPOINT}
    public-endpoint: ${OURS_STORAGE_PUBLIC_ENDPOINT}
    region: ${OURS_STORAGE_REGION:auto}
    bucket: ${OURS_STORAGE_BUCKET}
    access-key: ${OURS_STORAGE_ACCESS_KEY}
    secret-key: ${OURS_STORAGE_SECRET_KEY}
    path-style: ${OURS_STORAGE_PATH_STYLE:true}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    dev.ours: INFO
