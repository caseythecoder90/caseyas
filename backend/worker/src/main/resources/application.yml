spring:
  application:
    name: ours-worker
  threads:
    virtual:
      enabled: true
  mongodb:
    uri: ${SPRING_MONGODB_URI}
  data:
    mongodb:
      auto-index-creation: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
