spring:
  application:
    name: ours-worker
  threads:
    virtual:
      enabled: true
  mongodb:
    uri: ${SPRING_MONGODB_URI}
  data:
    mongodb:
      auto-index-creation: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: media-worker
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: dev.ours.common.events
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer

ours:
  storage:
    endpoint: ${OURS_STORAGE_ENDPOINT}
    public-endpoint: ${OURS_STORAGE_PUBLIC_ENDPOINT}
    region: ${OURS_STORAGE_REGION:auto}
    bucket: ${OURS_STORAGE_BUCKET}
    access-key: ${OURS_STORAGE_ACCESS_KEY}
    secret-key: ${OURS_STORAGE_SECRET_KEY}
    path-style: ${OURS_STORAGE_PATH_STYLE:true}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
